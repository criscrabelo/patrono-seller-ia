<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background:#15151c; display:flex; gap:60px; justify-content:center; align-items:center; height:100vh; margin:0; font-family:sans-serif; }
  .box { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .mark { width:76px; height:76px; border-radius:22px; background:linear-gradient(140deg,#f0c94e,#e08e2d); display:grid; place-items:center; box-shadow:0 8px 24px -8px rgba(0,0,0,.5); }
  .mark svg { width:44px; height:44px; }
  .label { color:#ccc; font-size:13px; }
  .fav { width:16px; height:16px; border-radius:4px; background:linear-gradient(140deg,#f0c94e,#e08e2d); display:grid; place-items:center; }
  .fav svg { width:10px; height:10px; }
</style>
</head>
<body>

<div class="box">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none">
    <path d="M14.5 3l-6.5 2v4.2l4-1.2-5 5.4 4-.6-5 6.2 8-3-4 .8 5-5.4-4 .6z" fill="#241b0a"/>
    <path d="M4.5 4.5h1.6v3.6a1.8 1.8 0 0 0 1.8-1.8h-1.8V4.5h1.8a1.8 1.8 0 0 1 0 3.6H6.1" stroke="#241b0a" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg></div>
  <div class="fav"><svg viewBox="0 0 24 24" fill="none"><path d="M14.5 3l-6.5 2v4.2l4-1.2-5 5.4 4-.6-5 6.2 8-3-4 .8 5-5.4-4 .6z" fill="#241b0a"/></svg></div>
  <div class="label">A</div>
</div>

<div class="box">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none">
    <path d="M15 3l-5.5 6h3.5l-6 8 8.5-3.5h-3.5z" fill="#241b0a"/>
    <circle cx="6" cy="6" r="3.3" fill="none" stroke="#241b0a" stroke-width="1.3"/>
    <path d="M6 4.3v3.4" stroke="#241b0a" stroke-width="1.3" stroke-linecap="round"/>
  </svg></div>
  <div class="fav"><svg viewBox="0 0 24 24" fill="none"><path d="M15 3l-5.5 6h3.5l-6 8 8.5-3.5h-3.5z" fill="#241b0a"/></svg></div>
  <div class="label">B</div>
</div>

<div class="box">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none">
    <path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#241b0a"/>
    <path d="M3.5 3.2h2v3a1.5 1.5 0 0 0 0-3" stroke="#241b0a" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg></div>
  <div class="fav"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#241b0a"/></svg></div>
  <div class="label">C</div>
</div>

</body>
</html>
